name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache Buildozer global
      uses: actions/cache@v3
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: Install system-level dependencies for Kivy/Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          automake \
          libtool \
          pkg-config \
          ccache \
          libncurses5-dev \
          libtinfo-dev \
          libx11-dev \
          libxi-dev \
          libxext-dev \
          libgles2-mesa-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libffi-dev \
          libssl-dev \
          zlib1g-dev

    # --- 新增：清理系统垃圾文件 ---
    - name: Free disk space by removing unnecessary tools
      run: |
        sudo rm -rf /opt/hostedtoolcache
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/share/dotnet

    # --- 新增：增加 4G 虚拟内存 ---
    - name: Add Swap Memory
      run: |
        sudo fallocate -l 4G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cython
        pip install buildozer==1.5.0

    - name: Fix buildozer.spec
      run: |
        if ! grep -q "android.accept_sdk_license = True" buildozer.spec; then
          echo "android.accept_sdk_license = True" >> buildozer.spec
        fi
        sed -i 's/^p4a.source_dir/#p4a.source_dir/' buildozer.spec
        echo "buildozer.spec fixed."

    - name: Accept Android SDK licenses
      run: |
        export ANDROID_HOME=${ANDROID_HOME:-$HOME/Android/Sdk}
        if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin/" ]; then
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        fi

    - name: Build APK with Buildozer
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
      run: buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-kivy-app-apk
        path: bin/*.apk
