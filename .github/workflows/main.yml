name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Buildozer global
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: Install system-level dependencies for Kivy/Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          automake \
          libtool \
          pkg-config \
          ccache \
          libncurses5-dev \
          libtinfo-dev \
          libx11-dev \
          libxi-dev \
          libxext-dev \
          libgles2-mesa-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libffi-dev \
          libssl-dev \
          zlib1g-dev

    - name: Free disk space by removing unnecessary tools
      run: |
        sudo rm -rf /opt/hostedtoolcache
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /home/runner/.dotnet
        sudo rm -rf /home/runner/.cargo

    - name: Add Swap Memory
      run: |
        sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=4096
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile
        sudo swapon /mnt/swapfile
        free -h

    - name: Install Python dependencies
      run: |
        # 核心修改：在最初安装时就强制使用 pip==23.3.1，防止 buildozer 锁定高版本 pip
        python -m pip install --upgrade pip==23.3.1 setuptools wheel
        pip install cython --no-cache-dir
        pip install buildozer==1.5.0 --no-cache-dir

    - name: Fix buildozer.spec
      run: |
        if ! grep -q "android.accept_sdk_license = True" buildozer.spec; then
          echo "android.accept_sdk_license = True" >> buildozer.spec
        fi
        sed -i 's/^p4a.source_dir/#p4a.source_dir/' buildozer.spec
        echo "buildozer.spec fixed."

    - name: Accept Android SDK licenses
      run: |
        export ANDROID_HOME=${ANDROID_HOME:-$HOME/Android/Sdk}
        if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin/" ]; then
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        fi

    - name: Build APK with Buildozer
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
      run: |
        # 强制清理本地构建缓存，防止之前因 pip 版本不兼容留下的“有毒”文件干扰
        rm -rf .buildozer
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-kivy-app-apk
        path: bin/*.apk
